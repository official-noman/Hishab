<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hishab — Money tracker</title>
  <meta name="description" content="Private, offline personal and family expense tracker for bank, bKash and cash spending.">
  <meta name="theme-color" content="#0B0F14">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hishab">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .boot{position:fixed;inset:0;display:grid;place-items:center;background:
      radial-gradient(900px 500px at 15% -10%,rgba(43,217,162,.14),transparent 60%),
      radial-gradient(700px 500px at 110% 10%,rgba(124,156,255,.12),transparent 60%),#0B0F14;z-index:999}
    .boot-inner{display:flex;flex-direction:column;align-items:center;gap:18px;animation:bootIn .5s ease both}
    .boot-logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(160deg,#16232f,#0c1218);
      border:1px solid rgba(255,255,255,.09);display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
    .boot-logo svg{width:44px;height:44px}
    .boot-name{font-size:22px;font-weight:700;color:#EAF2F8;letter-spacing:.2px}
    .boot-name small{display:block;font-size:9.5px;letter-spacing:3px;color:#7D93A8;font-weight:600;text-align:center;margin-top:3px}
    .boot-bar{width:88px;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
    .boot-bar i{display:block;width:40%;height:100%;border-radius:99px;background:linear-gradient(90deg,#2BD9A2,#7C9CFF);animation:load 1.1s ease-in-out infinite}
    .boot-note{font-size:11px;color:#6F859A;letter-spacing:.4px}
    @keyframes bootIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){.boot-inner,.boot-bar i{animation:none}}
  </style>
</head>
<body>
  <div id="app">
    <div class="boot" id="boot">
      <div class="boot-inner">
        <div class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <rect x="16" y="35" width="7" height="14" rx="2.4" fill="#2BD9A2"/>
            <rect x="28.5" y="27" width="7" height="22" rx="2.4" fill="#4FE8BC"/>
            <rect x="41" y="19" width="7" height="30" rx="2.4" fill="#7C9CFF"/>
            <circle cx="49" cy="16" r="5.5" fill="#FF6B81"/>
          </svg>
        </div>
        <div class="boot-name">Hishab<small>MONEY TRACKER</small></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-note">Your money, clearly tracked</div>
      </div>
    </div>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript. Please turn it on and reload.</noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
